name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js
      - run: npx cap add android
      - run: python3 scripts/setup_android.py
      - run: npx cap sync android
      - run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk HeadTailCricket.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HeadTailCricket-APK
          path: HeadTailCricket.apk
